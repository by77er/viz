# Recording rules with a query offset, a group limit and group labels.
groups:
  - name: http.rules
    interval: 1m
    query_offset: 30s
    limit: 500
    labels:
      origin: recorded
    rules:
      - record: job:http_requests:rate5m
        expr: sum by (job) (rate(http_requests_total[5m]))
      - record: job:http_errors:ratio_rate5m
        expr: >
          sum by (job) (rate(http_requests_total{code=~"5.."}[5m]))
          /
          sum by (job) (rate(http_requests_total[5m]))
        labels:
          window: 5m
      - record: job:http_request_duration_seconds:p99
        expr: 'histogram_quantile(0.99, sum by (job, le) (rate(http_request_duration_seconds_bucket[5m])))'
      - alert: HighErrorRatio
        expr: job:http_errors:ratio_rate5m > 0.05   # depends on the rule above
        for: 10m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.job }}: {{ $value | humanizePercentage }} of requests fail"
          description: |
            The 5xx ratio of {{ $labels.job }} has been above 5% for 10 minutes.
            Current value: {{ printf "%.3f" $value }}.

            Check the deploy log first.

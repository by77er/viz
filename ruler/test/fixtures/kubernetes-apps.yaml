---
groups:
  - name: kubernetes-apps
    interval: 30s
    rules:
      - alert: KubePodCrashLooping
        annotations:
          description: 'Pod {{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) is in waiting state (reason: "CrashLoopBackOff").'
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubepodcrashlooping
          summary: Pod is crash looping.
        expr: max_over_time(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff", job="kube-state-metrics"}[5m]) >= 1
        for: 15m
        labels:
          severity: warning
      - alert: KubeDeploymentReplicasMismatch
        annotations:
          description: >-
            Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has not matched the
            expected number of replicas for longer than 15 minutes.
          summary: "Deployment has not matched the expected number of replicas."
        expr: |-
          (
            kube_deployment_spec_replicas{job="kube-state-metrics"}
              >
            kube_deployment_status_replicas_available{job="kube-state-metrics"}
          ) and (
            changes(kube_deployment_status_replicas_updated{job="kube-state-metrics"}[10m])
              ==
            0
          )
        for: 15m
        keep_firing_for: 5m
        labels:
          severity: warning
          team: "platform"
      - alert: KubeJobFailed
        annotations:
          description: Job {{ $labels.namespace }}/{{ $labels.job_name }} failed to complete. Removing failed job after investigation should clear this alert.
          summary: Job failed to complete.
        expr: kube_job_failed{job="kube-state-metrics"}  > 0
        for: 15m
        labels: {severity: warning, team: batch}

# Every push to main deploys vis.bitcru.sh. deploy/README.md describes the whole path.
#
#   push to main ──► checks (ci.yml, the same jobs a pull request runs; no secret)
#                ──► app-build (no secret, no environment): the web app built from an export of
#                    this commit's sources, handed over as an artifact (dist/ and build.json)
#                ──► deploy: takes that build as data and verifies it against its own checkout
#                    (source hash, serve.json, every file's SHA-256); deploy/deploy.sh = stage it
#                    for viz-gateway, resources, configure, upload every Worker, promote callees
#                    first, smoke test (the web app included); rollback to the previous release
#                    if the smoke test fails and no Durable Object migration was applied. A build
#                    that fails, or is not this commit's, stops before anything is uploaded.
#   manual run   ──► the same, with `acknowledge_migrations`; or, with `rollback_to`, restore
#                    the release recorded for that commit (refused across a migration)
#
# Where the secrets are (review of D74, M-1; deploy/README.md, "Who can read the Cloudflare
# token"). No job has them in its `env`. They are given, step by step, only to the steps that
# call Cloudflare, and no such step installs or builds anything. Third-party code that builds the
# web app (npm install scripts, Vite and its plugins) runs in `app-build`, a job that is given no
# secret and no environment; the deploy job runs none of it and no `npm run`. The deploy job's own
# installs (deploy/ and the deployed components) run in a step without secrets and without install
# scripts. deploy/test/workflow.test.mjs holds this file to all of that.
#
# Only main is deployed, and only with main's own deploy tooling (design/DECISIONS.md D69; review
# of D69, M-2): both jobs that hold the Cloudflare credentials refuse, as their first step, a run on
# any other ref. A run of this workflow on an older commit would run THAT commit's deploy/ and its
# workflow, which predate the rollback floors, format versions and key checks. That older file has
# no such step, so the `production` environment must also allow deployments from main only
# (deploy/README.md, One-time setup). Older code goes out again as a new commit on main (a revert),
# which this tooling judges like any release; or as a recorded release, with `rollback_to`.
#
# One run at a time (concurrency group deploy-production, nothing cancelled). GitHub keeps at
# most one run pending in the group and a newer one replaces it, so a push that arrives during
# a deploy waits, and the newest commit is the one deployed next.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      acknowledge_migrations:
        description: 'Durable Object migrations this deploy may apply, e.g. "viz-ingest@v2 viz-query@v2" (same as a "Migration: viz-ingest@v2" commit trailer)'
        type: string
        default: ''
      rollback_to:
        description: 'Instead of deploying: restore the release that was deployed from this full commit SHA'
        type: string
        default: ''
      rollback_only:
        description: 'With rollback_to: restore only these Workers of that record, e.g. "viz-query" (the others keep what serves now and are judged as they serve)'
        type: string
        default: ''
      app_drop_kept_files:
        description: 'Web app: keep NO file of earlier builds in this release (how a known-bad build''s files stop being served; pages opened before it get 404 for a chunk they have not loaded)'
        type: boolean
        default: false
      app_without_stage_evidence:
        description: 'Owner only. A reason, in words, to make the FIRST production release with the web app although no stage is recorded to have gone before it (deploy/records/app-stage-evidence.json). Logged and recorded'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  checks:
    if: ${{ github.event_name == 'push' || inputs.rollback_to == '' }}
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # The web app's build: third-party code (npm install scripts, Vite and its plugins) runs here and
  # nowhere else in this workflow. This job is given no secret and no environment, and what it
  # produces is data for the deploy job, which verifies it and executes none of it.
  app-build:
    name: Build the web app (no secrets)
    needs: checks
    if: ${{ github.event_name == 'push' || inputs.rollback_to == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes or fetches again: the workflow's token is not left on disk for the build to read.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            design-system/package-lock.json
      - name: Build from an export of this commit's sources (deploy/app.mjs handover)
        # The sources are app/ and what deploy/workers.json says it needs (design-system/, dashboard/src).
        # Refuses to run beside a Cloudflare credential; needs none, and no package of deploy/.
        run: node deploy/app.mjs handover --release "$GITHUB_SHA" --out "$RUNNER_TEMP/app-build"
      - name: Hand the build over
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-build-${{ github.sha }}
          path: ${{ runner.temp }}/app-build
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy vis.bitcru.sh
    needs: [checks, app-build]
    if: ${{ github.event_name == 'push' || inputs.rollback_to == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: production
      url: https://vis.bitcru.sh
    permissions:
      contents: read
    # No `env` here: the Cloudflare credentials are given to the steps that call Cloudflare, below,
    # and to no step that installs anything.
    steps:
      - name: Only main, with main's own deploy tooling (D69; review of D69, M-2)
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::This workflow deploys only main, with main's own deploy tooling, and this run is on ${GITHUB_REF}. An older commit's tooling cannot judge the release-safety rules added since (rollback floors, format versions, the OAuth key: design/DECISIONS.md D69). To go back to older code, restore a recorded release with rollback_to, or restore the code in a new commit on main (deploy/README.md, Rollback)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history: migration trailers are read from every commit since the
          # release that is serving now, including pushes whose own runs were replaced.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            deploy/package-lock.json
            stack/package-lock.json
            control/package-lock.json
            query/package-lock.json
      - name: WASM engines (built and tested by the checks)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-engines
          path: engine
      - name: The web app's build (made by app-build, which holds no secret; data, verified by deploy.sh)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-build-${{ github.sha }}
          # Outside the checkout: nothing in it is on a module path or is run.
          path: ${{ runner.temp }}/app-build
      - name: npm ci (deploy tooling and the deployed components; no secrets, no install scripts)
        run: deploy/deploy.sh --install-only
      - name: Migration acknowledgements
        id: acks
        env:
          # This step reads what serves now from Cloudflare's API.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INPUT_ACKS: ${{ inputs.acknowledge_migrations }}
        run: |
          node deploy/configure.mjs --ids-optional --release "$GITHUB_SHA" --quiet > /dev/null
          serving=$(node deploy/release.mjs current-release || true)
          if [ -n "$serving" ] && git cat-file -e "${serving}^{commit}" 2>/dev/null; then
            range=("${serving}..${GITHUB_SHA}")
          else
            range=(-1 "$GITHUB_SHA")
          fi
          trailers=$(git log --format='%(trailers:key=Migration,valueonly,separator=%x20)' "${range[@]}" | tr '\n' ' ')
          echo "Serving now: ${serving:-nothing}. Acknowledged: ${INPUT_ACKS} ${trailers}"
          echo "acks=${INPUT_ACKS} ${trailers}" >> "$GITHUB_OUTPUT"
      - name: deploy/deploy.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SMOKE_KEY: ${{ secrets.SMOKE_KEY }}
          VIZ_RELEASE_SHA: ${{ github.sha }}
          VIZ_ACK_MIGRATIONS: ${{ steps.acks.outputs.acks }}
          VIZ_WASM_PREBUILT: '1'
          # Installed by the step above, without secrets: this step installs nothing.
          VIZ_SKIP_NPM_CI: '1'
          # The handed-over build: read as data, verified against this checkout, never executed.
          VIZ_APP_BUILD: ${{ runner.temp }}/app-build
          VIZ_APP_NO_CARRY: ${{ inputs.app_drop_kept_files && '1' || '0' }}
          VIZ_APP_WITHOUT_STAGE_EVIDENCE: ${{ inputs.app_without_stage_evidence }}
        run: deploy/deploy.sh
      - name: Release record
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.sha }}
          # app.json: the web app's build as it was staged (every file with its SHA-256; D74).
          path: |
            deploy/generated/production/release.json
            deploy/generated/production/previous.json
            deploy/generated/production/rollback.json
            deploy/generated/production/manifest.json
            deploy/generated/production/app.json
          if-no-files-found: ignore
          retention-days: 90

  rollback:
    name: Roll back vis.bitcru.sh to ${{ inputs.rollback_to }}
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.rollback_to != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://vis.bitcru.sh
    permissions:
      contents: read
      actions: read
    # No `env` here either: the credentials go to the two steps that call Cloudflare.
    steps:
      - name: Only main, with main's own deploy tooling (D69; review of D69, M-2)
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::This workflow deploys only main, with main's own deploy tooling, and this run is on ${GITHUB_REF}. An older commit's tooling cannot judge the release-safety rules added since (rollback floors, format versions, the OAuth key: design/DECISIONS.md D69). To go back to older code, restore a recorded release with rollback_to, or restore the code in a new commit on main (deploy/README.md, Rollback)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: deploy/package-lock.json
      - name: npm ci (deploy tooling; no secrets, no install scripts)
        run: cd deploy && npm ci --ignore-scripts --no-audit --no-fund
      - name: Find the release record of ${{ inputs.rollback_to }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.rollback_to }}
        run: |
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then echo "::error::rollback_to must be a full 40-character commit SHA"; exit 1; fi
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml --commit "$SHA" --status success --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$run_id" ]; then
            echo "::error::No successful deploy run of $SHA, so no release record to restore. To go back to that code, restore it in a new commit on main (git revert, or check out its components' directories from $SHA): main's tooling then deploys it and judges it like any release. Running this workflow on that commit is refused (it would run that commit's own, older deploy tooling)."
            exit 1
          fi
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "release-$SHA" --dir release
          test -s release/release.json
      - name: Roll back (callers first; refused across a Durable Object migration)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ONLY: ${{ inputs.rollback_only }}
        run: node deploy/release.mjs rollback --record release/release.json --only "$ONLY" --reason "workflow_dispatch by $GITHUB_ACTOR"
      - name: Smoke test
        env:
          SMOKE_KEY: ${{ secrets.SMOKE_KEY }}
          SHA: ${{ inputs.rollback_to }}
        run: |
          node deploy/configure.mjs --ids-optional --release "$SHA" --quiet > /dev/null
          node deploy/smoke.mjs
      - name: Rollback record
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rollback-${{ github.run_id }}
          path: deploy/generated/production/rollback.json
          if-no-files-found: ignore
          retention-days: 90

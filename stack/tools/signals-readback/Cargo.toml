[package]
name = "viz-signals-readback"
version = "0.1.0"
license = "Apache-2.0"
edition = "2021"
description = "Reads the span and log files the stack's write path made of an OTLP corpus back through viz-storage, viz-traceql and viz-logql, and compares with their in-memory sources. A test tool, never shipped."
publish = false

[dependencies]
viz-storage = { path = "../../../engine/storage" }
viz-traceql = { path = "../../../engine/traceql" }
viz-logql = { path = "../../../engine/logql" }
serde_json = "1"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-case"] }

[profile.release]
opt-level = 2
debug = false

[workspace]

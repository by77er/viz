<!doctype html>
<html lang="en" class="vz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!-- The build adds <link rel="preload" as="font"> for the sans WOFF2 here (vite.config.ts, preloadSans). -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cstyle%3Epath%7Bstroke:%23111111%7D@media(prefers-color-scheme:dark)%7Bpath%7Bstroke:%23f2f2f2%7D%7D%3C/style%3E%3Cpath d='M1 12 L5 5 L8 9 L11 3 L15 12' fill='none' stroke-width='2' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E" />
    <title>viz · Explore</title>
    <script>
      // Apply the stored theme before first paint to avoid a flash. The design system reads
      // data-theme on the root; without it the theme follows the system setting.
      try {
        var t = localStorage.getItem('viz.theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

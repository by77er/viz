[package]
name = "viz-promql"
version = "0.1.0"
edition = "2021"
description = "PromQL evaluator for viz: pure, no I/O, runs natively and in WASM"
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
promql-parser = "0.11"
# Same version promql-parser links; used only to pre-scan tokens (see `guard_durations`).
lrpar = "0.14"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-case"] }
serde = "1"

[dev-dependencies]
serde_json = "1"
proptest = { version = "1", default-features = false, features = ["std"] }

# engine/AGENTS.md: fat LTO, one codegen unit and opt-level 3 measured fastest for WASM.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[workspace]

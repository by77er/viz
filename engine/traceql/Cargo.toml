[package]
name = "viz-traceql"
version = "0.1.0"
license = "Apache-2.0"
edition = "2021"
description = "TraceQL parser, planner and evaluator for viz: clean-room, pure, no I/O, runs natively and in WASM"
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
# TraceQL's =~ and !~ use Go's regular expressions: viz-goregex translates them for the regex
# crate (shared with viz-logql). Go's \d \w \s \b are ASCII, so no Unicode Perl-class tables are
# linked; (?i) needs the case-folding tables.
viz-goregex = { path = "../goregex" }
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-case"] }

[dev-dependencies]
serde_json = "1"
proptest = { version = "1", default-features = false, features = ["std"] }

# engine/AGENTS.md: fat LTO, one codegen unit and opt-level 3 measured fastest for WASM.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[workspace]

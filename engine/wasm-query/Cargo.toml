# The READ path's WebAssembly module: viz-query (which brings viz-storage and viz-promql)
# behind a plain C ABI. Separate from engine/wasm on purpose: the write path (edge, flush)
# should not carry the PromQL parser and the regex engine.
[package]
name = "viz-engine-wasm-query"
version = "0.1.0"
license = "Apache-2.0"
edition = "2021"
description = "viz query engine for WebAssembly: a C ABI over viz-query (plan, PromQL evaluation, select, metadata, file pruning), viz-traceql and viz-logql (traces and logs). No I/O."
publish = false

[lib]
name = "viz_query_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
viz-query = { path = "../query" }
viz-storage = { path = "../storage" }
# ABI 6: TraceQL and LogQL in the same module (viz-logql evaluates its vector operations on
# viz-promql, which viz-query links already; viz-goregex and regex are shared by both).
viz-traceql = { path = "../traceql" }
viz-logql = { path = "../logql" }
viz-goregex = { path = "../goregex" }
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-case"] }
# The versions viz-storage links (no second copy): the span and log readers (src/sigfiles.rs).
parquet = { version = "60", default-features = false, features = ["snap"] }
bytes = "1"
serde_json = "1"

# engine/AGENTS.md: the settings that measured faster.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[workspace]

# Replace the JavaScript bindings two dependencies of promql-parser link on wasm32, so the
# module instantiates with an EMPTY import object (../query/patches/README.md).
[patch.crates-io]
web-time = { path = "../query/patches/web-time" }
js-sys = { path = "../query/patches/js-sys" }
wasm-bindgen = { path = "../query/patches/wasm-bindgen" }

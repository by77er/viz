<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>viz · Pods</title><link rel="preload" as="font" type="font/woff2" crossorigin href="../../../dist/fonts/SchibstedGrotesk-Variable.woff2"><link rel="stylesheet" href="../../../dist/viz.css"><style>html{background:var(--ground)}body{margin:0}</style></head><body class="vz"><a class="vz-button vz-skip" href="#main">Skip to content</a><nav class="vz-nav" aria-label="Sections"><span class="vz-nav-name">viz</span><a href="#" aria-current="page">Explore</a><a href="#">Dashboards</a><a href="#">Monitors</a><a href="#">Traces</a><a href="#">Logs</a><a href="#" class="vz-nav-end">acme-prod</a><a href="#">Settings</a></nav>
<main class="vz-page" id="main">
  <header class="vz-page-head"><div><h1 class="vz-page-title">Pods of checkout-api</h1><p class="vz-page-sub">36 pods in prod. Updated <span class="vz-qty">12 s</span> ago.</p></div></header>
  <div><p class="vz-table-caption">30 of 36 pods, highest CPU first</p>
  <div class="vz-table-wrap"><table class="vz-table" id="pods"><thead><tr><th class="vz-label"><button class="vz-sort">Pod</button></th><th class="vz-label vz-right" aria-sort="descending"><button class="vz-sort">CPU, cores</button></th><th class="vz-label vz-right"><button class="vz-sort">Max, cores</button></th><th class="vz-label vz-right"><button class="vz-sort">Memory, MiB</button></th><th class="vz-label vz-right"><button class="vz-sort">Restarts</button></th><th class="vz-label">Node</th><th class="vz-label">Service</th></tr></thead><tbody></tbody></table></div></div>
</main>
<script src="../../../dist/viz-chart.js"></script>
<script>(function () { const s = vzChartDemos.many(36, 36).series.map((x) => { const v = x.values; return { l: x.labels, last: v[v.length - 1], max: Math.max(...v) } }).sort((a, b) => b.last - a.last).slice(0, 30)
  const cut = (p) => `<span class="vz-cut"><span>${p.slice(0, -10)}</span><span>${p.slice(-10)}</span></span>`
  document.querySelector('#pods tbody').innerHTML = s.map((r, i) => `<tr${i === 2 ? ' aria-current="true"' : ''}><td data-key title="${r.l.pod}"><a class="vz-link" href="#">${cut(r.l.pod)}</a></td><td class="vz-num vz-right">${r.last.toFixed(2)}</td><td class="vz-num vz-right">${r.max.toFixed(2)}</td><td class="vz-num vz-right">${Math.round(200 + r.max * 160)}</td><td class="vz-num vz-right">${i % 7 === 3 ? 1 : 0}</td><td>${r.l.node}</td><td>${r.l.service}</td></tr>`).join('') })()</script></body></html>

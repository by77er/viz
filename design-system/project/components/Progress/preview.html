<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0}body{padding:24px}.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}.col{display:flex;flex-direction:column;gap:16px}</style></head><body class="vz">
<div class="col" style="gap:var(--space-8);max-width:560px">
  <div class="vz-progress">
    <div class="vz-progress-track" role="progressbar" aria-label="Query" aria-valuemin="0" aria-valuemax="40" aria-valuenow="12" aria-valuetext="Scanning 12 of 40 files"><div class="vz-progress-bar" style="transform:scaleX(0.3)"></div></div>
    <div class="vz-progress-text"><span role="status">Scanning 12 of 40 files</span><span class="vz-qty" aria-hidden="true">2.4 s</span><button class="vz-progress-action">Cancel</button></div>
  </div>
  <div class="vz-progress" data-unmeasured>
    <div class="vz-progress-track"><div class="vz-progress-bar"></div></div>
    <div class="vz-progress-text"><span role="status">Waiting for 2 shards</span><span class="vz-qty" aria-hidden="true">3.1 s</span><button class="vz-progress-action">Cancel</button></div>
  </div>
  <div class="vz-progress">
    <div class="vz-progress-track" role="progressbar" aria-label="Query" aria-valuemin="0" aria-valuemax="40" aria-valuenow="31" aria-valuetext="Stopped at 31 of 40 files"><div class="vz-progress-bar" style="transform:scaleX(0.775)"></div></div>
    <div class="vz-progress-text"><span role="status">Showing 31 of 40 files. 9 timed out.</span><span class="vz-qty" aria-hidden="true">10.0 s</span><button class="vz-progress-action">Retry</button></div>
  </div>
</div>
</body></html>

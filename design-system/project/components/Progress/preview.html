<!-- @dsCard group="Feedback" height=230 -->
<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0}body{padding:var(--space-6)}</style></head><body class="vz">
<div class="vz-sections">
  <div class="vz-progress">
    <div class="vz-progress-track" role="progressbar" aria-label="Query" aria-valuemin="0" aria-valuemax="40" aria-valuenow="12" aria-valuetext="Scanning 12 of 40 files"><div class="vz-progress-bar" data-fraction="0.3"></div></div>
    <div class="vz-progress-text"><span role="status">Scanning 12 of 40 files</span><span class="vz-qty" aria-hidden="true">2.4 s</span><button class="vz-progress-action">Cancel</button></div>
  </div>
  <div class="vz-progress" data-unmeasured>
    <div class="vz-progress-text"><span role="status">Waiting for 2 shards</span><span class="vz-qty" aria-hidden="true">3.1 s</span><button class="vz-progress-action">Cancel</button></div>
  </div>
  <div class="vz-progress">
    <div class="vz-progress-track" role="progressbar" aria-label="Query" aria-valuemin="0" aria-valuemax="40" aria-valuenow="31" aria-valuetext="Stopped at 31 of 40 files"><div class="vz-progress-bar" data-fraction="0.775"></div></div>
    <div class="vz-progress-text"><span role="status">Showing 31 of 40 files. 9 timed out.</span><span class="vz-qty" aria-hidden="true">10.0 s</span><button class="vz-progress-action">Retry</button></div>
  </div>
</div>
<script>
document.querySelectorAll(".vz-progress-bar[data-fraction]").forEach((b) => { b.style.transform = "scaleX(" + b.dataset.fraction + ")" })
</script>
</body></html>

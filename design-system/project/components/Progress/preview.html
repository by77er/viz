<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400..700&display=swap"><style>html,body{margin:0}body{padding:24px}.col{display:flex;flex-direction:column;gap:24px;max-width:560px}</style></head><body class="vz">
<div class="col">
  <div class="vz-progress" role="progressbar" aria-valuemin="0" aria-valuemax="40" aria-valuenow="12" aria-label="Query progress">
    <div class="vz-progress-track"><div class="vz-progress-bar" style="transform:scaleX(0.3)"></div></div>
    <div class="vz-progress-text"><span>Scanning 12 of 40 files</span><span class="vz-num">1.4 s</span></div>
  </div>
  <div class="vz-progress" data-unmeasured role="status">
    <div class="vz-progress-track"><div class="vz-progress-bar"></div></div>
    <div class="vz-progress-text"><span>Waiting for 2 shards</span><span class="vz-num">3.1 s</span></div>
  </div>
  <div class="vz-progress" role="status">
    <div class="vz-progress-track"><div class="vz-progress-bar" style="transform:scaleX(1)"></div></div>
    <div class="vz-progress-text"><span>Showing 31 of 40 files. 9 timed out. <a href="#" style="color:inherit">Retry</a></span><span class="vz-num">10.0 s</span></div>
  </div>
</div>
</body></html>

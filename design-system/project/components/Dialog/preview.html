<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0}body{padding:24px}.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}.col{display:flex;flex-direction:column;gap:16px}.scrimdemo{position:relative;min-height:340px}.scrimdemo .vz-scrim{position:absolute}</style></head><body class="vz">

    </div>
  </div>

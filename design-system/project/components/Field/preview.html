<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400..700&display=swap"><style>html,body{margin:0}body{padding:24px}.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}.col{display:flex;flex-direction:column;gap:16px}</style></head><body class="vz">
<div class="row" style="align-items:flex-start;gap:24px">
  <label class="vz-field" style="width:260px"><span class="vz-label">Name</span>
    <input class="vz-input" id="f1" value="Checkout latency">
    <span class="vz-help">Shown in the dashboard list.</span></label>
  <label class="vz-field" style="width:260px"><span class="vz-label">Evaluate every</span>
    <input class="vz-input" id="f2" data-mono value="15x" aria-invalid="true">
    <span class="vz-help" data-error>Use a duration such as 30s, 1m or 5m.</span></label>
  <label class="vz-field" style="width:200px"><span class="vz-label">Tenant</span>
    <input class="vz-input" id="f3" placeholder="Search tenants" disabled></label>
</div>
</body></html>

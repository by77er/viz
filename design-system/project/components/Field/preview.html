<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0}body{padding:24px}.row{display:flex;flex-wrap:wrap;align-items:center;gap:12px}.col{display:flex;flex-direction:column;gap:16px}</style></head><body class="vz">
<div class="row" style="align-items:flex-start;gap:24px">
  <label class="vz-field" style="width:240px"><span class="vz-label">Name</span>
    <input class="vz-input" id="f1" value="Checkout latency">
    <span class="vz-help">Shown in the dashboard list.</span></label>
  <label class="vz-field" style="width:240px"><span class="vz-label">Evaluate every</span>
    <input class="vz-input" id="f2" data-mono value="15x" aria-invalid="true" aria-describedby="f2e">
    <span class="vz-help" data-error id="f2e"><span class="vz-mark" data-state="critical"></span>Use a duration such as 30s, 1m or 5m.</span></label>
  <label class="vz-field" style="width:200px"><span class="vz-label">Severity</span>
    <select class="vz-select" id="f4"><option>Page</option><option>Ticket</option><option>Log only</option></select></label>
  <label class="vz-field" style="width:200px"><span class="vz-label">Tenant</span>
    <input class="vz-input" id="f3" placeholder="Search tenants" disabled></label>
</div>
<div class="row" style="margin-top:20px;gap:24px">
  <label class="vz-check"><input type="checkbox" id="c1" checked>Notify when resolved</label>
  <label class="vz-check"><input type="checkbox" id="c2">Include in the weekly report</label>
  <label class="vz-check"><input type="checkbox" id="c3" disabled>Managed by policy</label>
</div>
</body></html>

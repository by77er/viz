<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0}body{padding:var(--space-6)}</style></head><body class="vz">
<div class="vz-controls">
<div class="vz-menu" role="menu" aria-label="Query">
  <div role="menuitem" data-active>Run query <span class="vz-kbd">⌘↵</span></div>
  <div role="menuitem">Add to dashboard <span class="vz-kbd">⌘D</span></div>
  <div role="menuitem">Copy link <span class="vz-kbd">⌘L</span></div>
  <div role="separator"></div>
  <div role="menuitem">Create monitor from query</div>
  <div role="menuitem">View as text</div>
</div>
<div class="vz-menu" role="menu" aria-label="Silence for">
  <button role="menuitemradio" aria-checked="false">15 min</button>
  <button role="menuitemradio" aria-checked="true">1 h</button>
  <button role="menuitemradio" aria-checked="false">4 h</button>
  <button role="menuitemradio" aria-checked="false">Until resolved</button>
  <div role="separator"></div>
  <p class="vz-menu-note">Pages stop until <span class="vz-qty">16:16</span>. The monitor keeps evaluating, and the history says who silenced it.</p>
  <div class="vz-controls"><button class="vz-button" data-tone="yellow">Silence for 1 h</button></div>
</div>
<div class="vz-menu" role="menu" aria-label="Key ingest-eu">
  <button role="menuitem">Rename</button>
  <div role="separator"></div>
  <button role="menuitem">Revoke key…</button>
</div>
</div>
</body></html>

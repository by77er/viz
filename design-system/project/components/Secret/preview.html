<!-- @dsCard group="Overlays" height=400 -->
<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0}body{padding:var(--space-6)}</style></head><body class="vz">
<div class="vz-dialog" role="dialog" aria-labelledby="sec-t" data-secret="viz_k7Qm2xVbT9cLr8Hn3pWe4f2a">
  <h2 class="vz-dialog-title" id="sec-t">Save the key for "ingest-eu"</h2>
  <div class="vz-secret">
    <div class="vz-secret-row"><output class="vz-query vz-secret-value" aria-label="Write key"></output><button class="vz-button" data-size="sm" data-act="reveal">Reveal</button><button class="vz-button" data-size="sm" data-act="copy">Copy key</button></div>
    <p class="vz-help" data-error><span class="vz-mark" data-state="warn"></span>This is the only time the key is shown. viz keeps a hash of it and cannot show it again.</p>
    <label class="vz-check"><input type="checkbox" data-act="saved">I have saved the key</label>
  </div>
  <div class="vz-dialog-actions"><button class="vz-button" data-quiet data-act="discard">Discard this key</button><button class="vz-button" data-tone="blue" data-act="done" disabled>Done</button></div>
</div>
<script>
document.querySelectorAll("[data-secret]:not([data-ready])").forEach((el) => { el.dataset.ready = "1"
  const key = el.dataset.secret, out = el.querySelector("output"), reveal = el.querySelector("[data-act=reveal]"), copy = el.querySelector("[data-act=copy]"), saved = el.querySelector("[data-act=saved]"), done = el.querySelector("[data-act=done]")
  let shown = false; const paint = () => { out.textContent = shown ? key : key.slice(0, 4) + "•".repeat(key.length - 8) + key.slice(-4); reveal.textContent = shown ? "Hide" : "Reveal"; reveal.setAttribute("aria-pressed", shown) }
  reveal.addEventListener("click", () => { shown = !shown; paint() })
  copy.addEventListener("click", () => { navigator.clipboard?.writeText(key).catch(() => {}); copy.textContent = "Copied"; setTimeout(() => { copy.textContent = "Copy key" }, 2000) })
  saved.addEventListener("change", () => { done.disabled = !saved.checked })
  paint() })
</script>
</body></html>

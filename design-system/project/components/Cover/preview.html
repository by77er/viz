<!-- @dsCard height=288 -->
<!doctype html><html><head><meta charset="utf-8">

<style>
html,body{margin:0}
.cover{position:relative;width:960px;height:288px;background:var(--ground);overflow:hidden}
.cover svg{position:absolute;inset:0}
.b-blue{fill:var(--blue)}.b-ink{fill:var(--ink)}.b-yellow{fill:var(--yellow)}.b-red{fill:var(--red)}.b-green{fill:var(--green)}.b-sunken{fill:var(--sunken)}
.grid{stroke:var(--rule);stroke-width:1}
.words{position:absolute;left:32px;bottom:32px;width:440px;font-family:var(--font-sans)}
.name{font-size:120px;line-height:.92;letter-spacing:-.045em;font-weight:500;color:var(--ink)}
.tag{margin-top:16px;font-size:14px;line-height:20px;color:var(--ink-muted)}
</style></head><body>
<div class="cover">
<!--
blocks: blue 96x192, ink 48x128, yellow 64x160, red 32x64, green 96x96, sunken 72x224; widths are multiples of space-4 and space-8, corners radius-0.
arrangement: unequal bands rising from one baseline with space-2 gaps, the last bleeding off the right edge, the way the product draws bars.
pattern: borders-not-shadows system: four hairlines in the rule token crossing the blocks as a chart's gridlines.
steps and radii: space-2 gaps, space-8 row pitch (64px), radius-0.
-->
<svg viewBox="0 0 960 288" width="960" height="288" aria-hidden="true">
  <rect class="b-sunken" x="888" y="32" width="72" height="224"/>
  <rect class="b-blue" x="512" y="64" width="96" height="192"/>
  <rect class="b-ink" x="616" y="128" width="48" height="128"/>
  <rect class="b-yellow" x="672" y="96" width="64" height="160"/>
  <rect class="b-red" x="744" y="192" width="32" height="64"/>
  <rect class="b-green" x="784" y="160" width="96" height="96"/>
  <g class="grid"><line x1="496" y1="64.5" x2="960" y2="64.5"/><line x1="496" y1="128.5" x2="960" y2="128.5"/><line x1="496" y1="192.5" x2="960" y2="192.5"/><line x1="496" y1="256.5" x2="960" y2="256.5"/></g>
</svg>
<div class="words"><div class="name">viz</div><div class="tag">Metrics, logs and traces, read clearly.</div></div>
</div>
</body></html>
